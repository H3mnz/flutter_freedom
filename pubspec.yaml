name: flutter_freedom
description: "freedom of vpns for flutter developers in Iran"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  window_manager: ^0.5.1
  url_launcher: ^6.3.2
  path: ^1.9.1
  bot_toast: ^4.1.3
  file_picker: ^11.0.2
  rename_app: ^1.6.6
  font_awesome_flutter: ^11.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
    - assets/data/


  fonts:
    - family: IranSans
      fonts:
        - asset: assets/fonts/IranSans.ttf
